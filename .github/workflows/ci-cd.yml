name: CI/CD - Sistema Biblioteca

on:
  push:
    branches:
      - develop
      - main
      - ci-cd-final

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Instalar dependências Frontend
      - name: Instalar dependências Frontend
        working-directory: frontend-biblioteca
        run: npm ci --no-audit --no-fund --loglevel verbose

      # ========================================================
      # TESTES FRONTEND
      # ========================================================

      - name: Testes Frontend
        working-directory: frontend-biblioteca
        run: npm test


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instalar dependências Backend
      - name: Instalar dependências Backend
        run: python -m pip install -r backendcombanco/requirements.txt

      # ========================================================
      # TESTES BACKEND
      # ========================================================

      - name: Testes Backend
        run: python -m pytest backendcombanco


  # ============================================================
  # DOCKER BUILD
  # ============================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    # Docker só executa se FRONTEND e BACKEND
    # passarem em todos os testes.
    needs:
      - frontend-tests
      - backend-tests

    steps:

      # 1. Baixar código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Construir imagens Docker
      - name: Construir imagens Docker
        run: docker compose -f backendcombanco/docker-compose.yml build
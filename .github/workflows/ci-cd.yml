name: CI/CD - Sistema Biblioteca

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependências
      - name: Instalar dependências Frontend
        working-directory: frontend
        run: npm ci

      # ========================================================
      # SMOKE TEST
      # ========================================================

      - name: Smoke Test - Frontend
        working-directory: frontend
        run: npm run test:smoke

      # ========================================================
      # SANITY TEST
      # ========================================================

      - name: Sanity Test - Frontend
        working-directory: frontend
        run: npm run test:sanity

      # ========================================================
      # TESTE DE REGRESSÃO
      # ========================================================

      - name: Teste de Regressão - Frontend
        working-directory: frontend
        run: npm run test:regression


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Instalar dependências
      - name: Instalar dependências Backend
        working-directory: backend
        run: npm ci

      # ========================================================
      # SMOKE TEST
      # ========================================================

      - name: Smoke Test - Backend
        working-directory: backend
        run: npm run test:smoke

      # ========================================================
      # SANITY TEST
      # ========================================================

      - name: Sanity Test - Backend
        working-directory: backend
        run: npm run test:sanity

      # ========================================================
      # TESTE DE REGRESSÃO
      # ========================================================

      - name: Teste de Regressão - Backend
        working-directory: backend
        run: npm run test:regression


  # ============================================================
  # DOCKER BUILD
  # ============================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    # Docker só executa se FRONTEND e BACKEND
    # passarem em todos os testes.
    needs:
      - frontend-tests
      - backend-tests

    steps:

      # 1. Baixar código
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Construir imagens Docker
      - name: Construir imagens Docker
        run: docker compose -f backendcombanco/docker-compose.yml build
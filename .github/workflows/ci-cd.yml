
name: CI/CD - Sistema Biblioteca

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # CI - TESTES BACKEND
  # ============================================================

  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências Backend
        run: python -m pip install -r backendcombanco/requirements.txt

      - name: Executar testes Backend
        run: python -m pytest backendcombanco


  # ============================================================
  # CI - TESTES FRONTEND
  # ============================================================

  test-frontend:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências Frontend
        run: npm install --prefix frontend-biblioteca

      - name: Executar testes Frontend
        run: npm test --prefix frontend-biblioteca


  # ============================================================
  # DOCKER BUILD
  # ============================================================

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagens Docker
        run: docker compose -f backendcombanco/docker-compose.yml build
name: CI/CD - Sistema Biblioteca

on:
  push:
    branches:
      - develop
      - main
      - ci-cd-final

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v5

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      # 3. Instalar dependências Frontend
      - name: Instalar dependências Frontend
        working-directory: frontend-biblioteca
        run: npm ci --no-audit --no-fund

      # ========================================================
      # TESTES FRONTEND
      # ========================================================

      - name: Testes Frontend
        working-directory: frontend-biblioteca
        run: npm test


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:

      # 1. Baixar o código
      - name: Baixar código
        uses: actions/checkout@v5

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Instalar dependências Backend
      - name: Instalar dependências Backend
        run: python -m pip install -r backendcombanco/requirements.txt

      # ========================================================
      # TESTES BACKEND
      # ========================================================

      - name: Testes Backend
        run: python -m pytest backendcombanco


  # ============================================================
  # DOCKER BUILD & PUSH (GHCR)
  # ============================================================

  docker:
    name: Docker Build & Push (GHCR)
    runs-on: ubuntu-latest

    # Docker só executa se FRONTEND e BACKEND passarem em todos os testes.
    needs:
      - frontend-tests
      - backend-tests

    permissions:
      contents: read
      packages: write # Permissão obrigatória para publicar no GHCR

    steps:

      # 1. Baixar código
      - name: Baixar código
        uses: actions/checkout@v5

      # 2. Configurar o Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autenticar no GitHub Container Registry (GHCR)
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construir e Publicar a Imagem do Backend
      - name: Construir e publicar imagem do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backendcombanco
          file: ./backendcombanco/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/biblioteca-backend:1.0.0

      # 5. Construir e Publicar a Imagem do Frontend
      - name: Construir e publicar imagem do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-biblioteca
          file: ./frontend-biblioteca/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/biblioteca-frontend:1.0.0

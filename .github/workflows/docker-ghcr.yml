name: Docker GHCR

on:
  push:
    branches:
      - develop

jobs:

  # ============================================================
  # TESTES FRONTEND
  # ============================================================

  frontend-tests:
    name: Testes Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-biblioteca/package-lock.json

      - name: Instalar dependências
        working-directory: frontend-biblioteca
        run: npm ci --no-audit --no-fund

      - name: Executar testes
        working-directory: frontend-biblioteca
        run: npm test


  # ============================================================
  # TESTES BACKEND
  # ============================================================

  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r backendcombanco/requirements.txt

      - name: Executar testes
        run: python -m pytest backendcombanco


  # ============================================================
  # BUILD E PUBLICAÇÃO NO GHCR
  # ============================================================

  docker:
    name: Build e Publicação GHCR
    runs-on: ubuntu-latest

    # Só executa se TODOS os testes passarem
    needs:
      - frontend-tests
      - backend-tests

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Converter OWNER para minúsculo
        run: |
          echo "repo_owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backendcombanco
          file: ./backendcombanco/docker/Dockerfile
          push: true
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca-backend:1.0.1

      - name: Construir e publicar Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-biblioteca
          file: ./frontend-biblioteca/Dockerfile
          push: true
          tags: ghcr.io/${{ env.repo_owner }}/biblioteca-frontend:1.0.1
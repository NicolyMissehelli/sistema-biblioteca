services:
  backend:
    image: ghcr.io/nicolymissehelli/biblioteca-backend:${IMAGE_VERSION:-1.0.1}
    env_file:
      - path: backendcombanco/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/biblioteca.db
    volumes:
      - ghcr-data:/data
    ports:
      - "18000:8000"
    networks:
      default:
        aliases:
          - biblioteca-backend
  frontend:
    image: ghcr.io/nicolymissehelli/biblioteca-frontend:${IMAGE_VERSION:-1.0.1}
    ports:
      - "18080:80"
    depends_on:
      - backend
volumes:
  ghcr-data:

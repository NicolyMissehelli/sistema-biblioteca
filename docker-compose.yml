services:
  backend:
    build:
      context: ./backend
    container_name: biblioteca-backend
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: biblioteca-frontend
    ports:
      - "8080:80"
    environment:
      API_URL: http://localhost:3000/api
    depends_on:
      - backend
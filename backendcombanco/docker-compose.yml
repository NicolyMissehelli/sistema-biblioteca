services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: biblioteca-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-biblioteca
      dockerfile: Dockerfile
    container_name: biblioteca-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

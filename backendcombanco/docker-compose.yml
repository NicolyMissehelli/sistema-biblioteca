services:
  biblioteca:
    build:
      context: ..
      dockerfile: backendcombanco/docker/Dockerfile

    container_name: sistema-biblioteca

    env_file:
      - path: ./backendcombanco/.env
        required: false

    ports:
      - "8080:80"

    volumes:
      - ./backendcombanco/data:/data

    restart: unless-stopped